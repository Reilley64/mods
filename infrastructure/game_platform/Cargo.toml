[package]
name = "game-platform"
version = "0.0.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
application = { path = "../../application", version = "0.0.0" }
cap-std = "=3.4.6"
domain = { path = "../../domain", version = "0.0.0" }
pelite = { version = "0.10", default-features = false, features = ["std"] }
rootcause = "0.13"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[package]
name = "execution"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
application = { path = "../../application", version = "0.0.0" }
domain = { path = "../../domain", version = "0.0.0" }
rootcause = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.4.7"

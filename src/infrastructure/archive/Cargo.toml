[package]
name = "infrastructure-archive"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
application = { workspace = true }
crc32fast = "1.5.2"
domain = { workspace = true }
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false, features = ["encoding"] }
rars = "0.9.4"
rootcause = { workspace = true }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "brotli", "lz4", "zstd"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
unicode-normalization = "0.1.24"
zip = { version = "8.6.0", default-features = false, features = ["bzip2", "deflate64", "deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zip = { version = "8.6.0", default-features = false, features = ["bzip2", "deflate64", "deflate-flate2-zlib-rs"] }

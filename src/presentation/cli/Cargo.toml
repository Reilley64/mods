[package]
name = "mods"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true

[[bin]]
name = "mods"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
application = { path = "../../application", version = "0.0.0" }
clap = { version = "4.6.7", features = ["derive"] }
domain = { path = "../../domain", version = "0.0.0" }
infrastructure = { path = "../../infrastructure/dependencies", version = "0.0.0" }
rootcause = "0.13.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

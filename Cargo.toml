[workspace]
members = [
  "src/domain",
  "src/application",
  "src/infrastructure/environment",
  "src/infrastructure/settings",
  "src/infrastructure/nexus",
  "src/infrastructure/game_platform",
  "src/infrastructure/archive",
  "src/infrastructure/execution",
  "src/infrastructure/dependencies",
  "src/presentation/cli",
]
resolver = "3"

[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates are unpublished; inherited paths must allow independent releases.
application = { path = "src/application" }
domain = { path = "src/domain" }
encoding_rs = "0.8.41"
infrastructure-dependencies = { path = "src/infrastructure/dependencies" }
rootcause = "0.13.0"
serde = "1.0.229"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

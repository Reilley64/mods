name: Publish stable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing aggregate stable tag to repair (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  stable:
    # Remove false only after the clean disconnected rebuild evidence in
    # docs/distribution.md is accepted. This is not a per-release approval gate.
    if: ${{ false && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease) }}
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    steps:
      - name: Validate exact stable tag and published release
        id: release
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:RELEASE_TAG -eq 'v0.0.0') { throw 'Invalid aggregate stable tag' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Existing release is required' }
          $release = $json | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'Published stable release required' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - run: bun install --frozen-lockfile
      - name: Fetch native runtime for shared checks
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
      - name: Shared release checks
        run: bun run check
      - name: Package committed stable snapshot
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ReleaseId $env:RELEASE_TAG
      - name: Add missing assets and verify anonymous public bytes
        shell: pwsh
        run: bun scripts/stable-release.ts publish $env:RELEASE_TAG

  winget:
    needs: stable
    # Also blocked until the human bootstrap and real portable-layout validation.
    if: ${{ false }}
    runs-on: windows-2022
    environment: winget
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.stable.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.stable.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Fetch pinned Microsoft WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash -ne '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') { throw 'WingetCreate checksum mismatch' }
      - name: Reverify public assets, deduplicate and update bootstrapped package
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: bun scripts/update-winget.ts $env:RELEASE_TAG

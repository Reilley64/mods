name: Publish stable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing aggregate stable tag to repair (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  stable:
    # The owner approved CLI-only v0.1.0 publication and release PR merge.
    # The disconnected rebuild was owner-waived, not passed or required.
    if: ${{ (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease) }}
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    steps:
      - name: Validate exact stable tag and published release
        id: release
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:RELEASE_TAG -eq 'v0.0.0') { throw 'Invalid aggregate stable tag' }
          if ($env:RELEASE_TAG -eq 'v0.1.0') { throw 'Historical v0.1.0 publication is immutable' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Existing release is required' }
          $release = $json | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'Published stable release required' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - run: bun install --frozen-lockfile
      - name: Fetch native runtime for shared checks
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
      - name: Shared release checks
        run: bun run check
      - name: Package committed stable snapshot
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ReleaseId $env:RELEASE_TAG
      - name: Smoke packaged stable with Windows Shell
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./scripts/test-windows-package.ps1 -ReleaseId $env:RELEASE_TAG
      - name: Retain exact candidate for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mods-${{ steps.release.outputs.tag }}-windows-candidate
          path: dist/*
          retention-days: 90
      - name: Add missing assets and verify anonymous public bytes
        shell: pwsh
        run: bun scripts/stable-release.ts publish $env:RELEASE_TAG

  winget:
    needs: stable
    # Opt-in only: bootstrap, native lifecycle proof and credentials remain activation requirements.
    if: ${{ vars.WINGET_UPDATES_ENABLED == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    environment: winget
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.stable.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.stable.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Provision pinned WinGet on the disposable runner
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -ErrorAction Stop
          Repair-WinGetPackageManager -Version 1.29.380 -Force -ErrorAction Stop
          $apps = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          $env:PATH += ";$apps"
          $apps >> $env:GITHUB_PATH
          $version = winget --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -cne 'v1.29.380') { throw 'Pinned WinGet is unavailable' }
      - name: Fetch pinned Microsoft WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash -ne '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') { throw 'WingetCreate checksum mismatch' }
      - name: Generate, check and validate the exact manifests
        id: prepare
        shell: pwsh
        run: bun scripts/update-winget.ts prepare $env:RELEASE_TAG
      - name: Gate submission on native install, help, version and uninstall
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        shell: pwsh
        env:
          MANIFEST_DIRECTORY: ${{ steps.prepare.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: ./scripts/test-winget-install.ps1 -ManifestDirectory $env:MANIFEST_DIRECTORY -Version $env:PACKAGE_VERSION
      - name: Collect Winget diagnostics
        if: always()
        shell: pwsh
        run: |
          $destination = 'dist/winget-evidence/native-logs'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $paths = @(
            "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir",
            "$env:LOCALAPPDATA\Microsoft\WinGet\DiagOutputDir",
            "$env:LOCALAPPDATA\Microsoft\WindowsPackageManagerManifestCreator\DiagOutputDir"
          )
          for ($i = 0; $i -lt $paths.Count; $i++) {
            if (Test-Path -LiteralPath $paths[$i]) { Copy-Item -LiteralPath $paths[$i] -Destination "$destination/$i" -Recurse -Force }
          }
      - name: Retain checked manifests and install receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mods-${{ needs.stable.outputs.tag }}-winget-candidate
          path: |
            dist/winget/
            dist/winget-evidence/
          retention-days: 90
      - name: Submit the checked and install-tested directory
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
        shell: pwsh
        env:
          WINGET_UPDATES_ENABLED: ${{ vars.WINGET_UPDATES_ENABLED }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: bun scripts/update-winget.ts submit $env:RELEASE_TAG

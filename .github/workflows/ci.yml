name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  tools:
    uses: ./.github/workflows/tools.yml

  check:
    runs-on: windows-2022
    outputs:
      rust_changed: ${{ steps.rust-changes.outputs.changed }}
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Rust changes
        id: rust-changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if (-not $env:BASE_SHA -or $env:BASE_SHA -eq "0000000000000000000000000000000000000000") {
            $changed = git ls-tree --name-only -r $env:HEAD_SHA
          } else {
            $changed = git diff --name-only $env:BASE_SHA $env:HEAD_SHA
          }
          $rustChanged = ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') -or '${{ github.event_name }}' -eq 'schedule' -or '${{ github.event_name }}' -eq 'workflow_dispatch' -or @($changed | Where-Object {
            $_ -match '^(src/|native/|licenses/|\.github/workflows/ci\.yml$|\.gitmodules$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|rustfmt\.toml$)'
          }).Count -gt 0
          "changed=$($rustChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install repository tools
        run: bun install --frozen-lockfile
      - name: Set up Rust
        if: steps.rust-changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - name: Install cargo-nextest
        if: steps.rust-changes.outputs.changed == 'true'
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - name: Test native release validation
        if: steps.rust-changes.outputs.changed == 'true'
        shell: pwsh
        run: ./native/fetch.tests.ps1
      - name: Fetch pinned native release
        if: steps.rust-changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Compile and test x86 adapter bindings
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo test --locked --package infrastructure-execution --target i686-pc-windows-msvc
      - name: Run Rust checks
        if: steps.rust-changes.outputs.changed == 'true'
        run: bun run check:rust
      - name: Record validated revision
        id: validated
        if: success() && steps.rust-changes.outputs.changed == 'true'
        shell: pwsh
        run: '"sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT'

  preview-ready:
    needs: [check, tools]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.tools.result == 'success' && needs.check.outputs.validated_sha == github.sha }}
    runs-on: windows-2022
    steps:
      - run: echo "Main revision passed Rust and repository tool checks."

  preview:
    # Disabled until complete corresponding source (including required static
    # dependency source) is distributable. Registry references are insufficient.
    if: ${{ false }}
    needs: preview-ready
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-21
          targets: x86_64-pc-windows-msvc
      - name: Fetch pinned native release
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Package preview
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ReleaseId $env:GITHUB_SHA
      - name: Upload tagless preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
          path: |
            dist/mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
            dist/SHA256SUMS
          retention-days: 90

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install repository tools
        run: bun install --frozen-lockfile
      - name: Run shared checks
        run: bun run check

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-21
          targets: x86_64-pc-windows-msvc
      - name: Build preview
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package preview
        shell: pwsh
        run: |
          $artifact = "mods-$env:GITHUB_SHA-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/mods.exe -DestinationPath "dist/$artifact"
      - name: Upload tagless preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
          path: dist/mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
          retention-days: 90

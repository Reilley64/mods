name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    outputs:
      rust_changed: ${{ steps.rust-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Rust changes
        id: rust-changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if (-not $env:BASE_SHA -or $env:BASE_SHA -eq "0000000000000000000000000000000000000000") {
            $changed = git ls-tree --name-only -r $env:HEAD_SHA
          } else {
            $changed = git diff --name-only $env:BASE_SHA $env:HEAD_SHA
          }
          $rustChanged = '${{ github.event_name }}' -eq 'schedule' -or '${{ github.event_name }}' -eq 'workflow_dispatch' -or @($changed | Where-Object {
            $_ -match '^(src/|native/|licenses/|\.github/workflows/ci\.yml$|\.gitmodules$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|rustfmt\.toml$)'
          }).Count -gt 0
          "changed=$($rustChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install repository tools
        run: bun install --frozen-lockfile
      - name: Set up Rust
        if: steps.rust-changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - name: Install cargo-nextest
        if: steps.rust-changes.outputs.changed == 'true'
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-nextest@0.9.145
          fallback: none
      - name: Test native release validation
        if: steps.rust-changes.outputs.changed == 'true'
        shell: pwsh
        run: ./native/fetch.tests.ps1
      - name: Fetch pinned native release
        if: steps.rust-changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Compile and test x86 adapter bindings
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo test --locked --package infrastructure-execution --target i686-pc-windows-msvc
      - name: Run Rust checks
        if: steps.rust-changes.outputs.changed == 'true'
        run: bun run check:rust

  preview:
    # Disabled until complete corresponding source (including required static
    # dependency source) is distributable. Registry references are insufficient.
    if: ${{ false }}
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-21
          targets: x86_64-pc-windows-msvc
      - name: Fetch pinned native release
        shell: pwsh
        run: |
          ./native/fetch.ps1
          "MODS_USVFS_ARTIFACTS=$pwd/native/artifacts/bin" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Build preview
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --package mods --package mods-mcp --bins
      - name: Package preview
        shell: pwsh
        run: |
          $artifact = "mods-$env:GITHUB_SHA-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          $binaries = @(
            "target/x86_64-pc-windows-msvc/release/mods.exe",
            "target/x86_64-pc-windows-msvc/release/mods-mcp.exe"
          )
          New-Item -ItemType Directory -Force dist/package/usvfs, dist/package/licenses | Out-Null
          Copy-Item $binaries dist/package
          Copy-Item native/artifacts/bin/* dist/package/usvfs
          Copy-Item -Recurse licenses/usvfs dist/package/licenses
          Copy-Item native/README.md dist/package/usvfs/BUILD-AND-SOURCE.md
          # Partial source bundle only; static dependency source still blocks publication.
          git archive --format=tar --output=dist/package/mods-source.tar HEAD
          $release = Get-Content -Raw native/usvfs-release.json | ConvertFrom-Json
          $source = "dist/package/$($release.sourceAsset)"
          Invoke-WebRequest "https://github.com/$($release.repository)/releases/download/$($release.tag)/$($release.sourceAsset)" -OutFile $source
          if ((Get-FileHash -Algorithm SHA256 $source).Hash -ne $release.sourceSha256) {
            throw "Native corresponding-source checksum mismatch"
          }
          Copy-Item -Recurse native/artifacts/licenses dist/package/licenses/native-release
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$artifact"
      - name: Upload tagless preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
          path: dist/mods-${{ github.sha }}-x86_64-pc-windows-msvc.zip
          retention-days: 90
